[project]
name = "safetysignal"
version = "0.1.0"
description = "Pharmacovigilance signal explorer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safetysignal"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migration files are auto-generated; lint chatter there isn't actionable.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # SQLAlchemy 2.0 deprecation chatter from third-party libs — not actionable.
    "ignore::DeprecationWarning:sqlalchemy.*",
]
