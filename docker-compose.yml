services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: safetysignal
      POSTGRES_PASSWORD: safetysignal
      POSTGRES_DB: safetysignal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetysignal -d safetysignal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://safetysignal:safetysignal@postgres:5432/safetysignal
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn safetysignal.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
